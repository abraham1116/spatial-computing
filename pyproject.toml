[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-computing"
version = "0.24.0"
description = "Spatial Computing: open-source infrastructure efficiency toolkit. Measure, decide, prove (compute, tiered memory, runtime routing, fleet)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Spatial Computing contributors" }]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.2", "psutil>=5.9", "numba>=0.59,<0.62", "lz4>=4.3", "cryptography>=42"]

[project.optional-dependencies]
build = ["ziglang>=0.13"]
dev = ["pytest>=8", "lxml>=5"]

[project.urls]
Homepage = "https://spatial-computing-ecru.vercel.app"
Repository = "https://github.com/abraham1116/spatial-computing"

[project.scripts]
spatial = "spatial.cli:main"

[tool.setuptools.packages.find]
include = ["spatial*"]

[tool.setuptools.package-data]
"spatial.fabric" = ["*.swift"]
"spatial.platform" = ["static/*", "static/fonts/*"]
"spatial.runtime.desktop" = ["Dockerfile", "start.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
