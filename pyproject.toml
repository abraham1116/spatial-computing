[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-computing"
version = "0.1.0"
description = "SPATIAL COMPUTING research prototype: measure, decide, prove (compute, memory tiering, runtime routing, hybrid quantum language)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Spatial Computing contributors" }]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2.2", "psutil>=5.9", "numba>=0.59,<0.62", "lz4>=4.3"]

[project.optional-dependencies]
quantum = ["qiskit>=2.0", "qiskit-aer>=0.17", "qiskit-qasm3-import>=0.5"]
build = ["ziglang>=0.13"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://spatial-computing.vercel.app"
Repository = "https://github.com/abraham1116/spatial-computing"

[project.scripts]
spatial = "spatial.cli:main"
spatialq = "spatial.q.runtime:main"

[tool.setuptools.packages.find]
include = ["spatial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
